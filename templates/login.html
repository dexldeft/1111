{% extends "base.html" %}

{% block content %}
<div class="auth-box">
    <h1>Вход</h1>
    <p class="subtitle">Войдите, чтобы выкладывать конспекты</p>

    <form method="POST" action="/login">
        <div class="field">
            <label>Имя пользователя</label>
            <input type="text" name="username" required>
        </div>
        <div class="field">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>
        <div class="field">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>

        <!-- НОВЫЙ БЛОК: Галочка "Запомнить меня" -->
        <div class="field" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" name="remember" id="remember" style="width: auto;">
            <label for="remember" style="margin-bottom: 0;">Запомнить меня</label>
        </div>
        <button type="submit" style="width:100%">Войти</button>
    </form>

    <div class="auth-switch">
        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
